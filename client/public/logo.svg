<svg width="340" height="90" viewBox="0 0 340 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sm-bear-grad" x1="45" y1="5" x2="45" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="45%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
    <linearGradient id="sm-star-grad" x1="45" y1="18" x2="45" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="sm-ai-grad" x1="260" y1="30" x2="295" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Bear Silhouette -->
  <g transform="translate(0, 0)">
    <!-- Ears -->
    <circle cx="23" cy="18" r="13" fill="url(#sm-bear-grad)" />
    <circle cx="67" cy="18" r="13" fill="url(#sm-bear-grad)" />

    <!-- Body -->
    <rect x="12" y="12" width="66" height="68" rx="20" fill="url(#sm-bear-grad)" />

    <!-- Sparkle star -->
    <path
      d="M 45 15 Q 45 22 51 22 Q 45 22 45 29 Q 45 22 39 22 Q 45 22 45 15 Z"
      fill="url(#sm-star-grad)"
    />

    <!-- Book Left -->
    <path
      d="M 43 45.5 C 36 43, 26 43.5, 20.5 45.8 C 19.8 46.1, 19 46.8, 19 47.7 L 19 66.5 C 19 67.4, 19.8 68.1, 20.6 67.9 C 26.5 65.8, 35.5 65.2, 43 68 Z"
      fill="#FFFFFF"
    />

    <!-- Book Right -->
    <path
      d="M 47 45.5 C 54 43, 64 43.5, 69.5 45.8 C 70.2 46.1, 71 46.8, 71 47.7 L 71 66.5 C 71 67.4, 70.2 68.1, 69.4 67.9 C 63.5 65.8, 54.5 65.2, 47 68 Z"
      fill="#F1F5F9"
    />
    <path d="M 45 46 L 45 67.5" stroke="#CBD5E1" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="96" y="47" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">LearnFlow <tspan fill="url(#sm-ai-grad)">AI</tspan></text>
  <text x="97" y="66" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#8E8E93">Your personal AI study partner</text>
</svg>

